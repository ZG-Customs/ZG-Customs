posedAt.</text><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="270" x="207.5" y="355.7498">.ics: samo Confirmed; Content-Type text/calendar.</text></g><g id="elem_GMN12"><path d="M649,270.3986 L649,363.1916 A0,0 0 0 0 649,363.1916 L1001,363.1916 A0,0 0 0 0 1001,363.1916 L1001,280.3986 L991,270.3986 L829,270.3986 L825,235.8086 L821,270.3986 L649,270.3986 A0,0 0 0 0 649,270.3986 " fill="#F8F9FA" style="stroke:#212529;stroke-width:0.5;"/><path d="M991,270.3986 L991,280.3986 L1001,280.3986 L991,270.3986 " fill="#F8F9FA" style="stroke:#212529;stroke-width:0.5;"/><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="271" x="655" y="286.6545">Dodjela: voditelj; aktivni &#269;lan njegova autoservisa.</text><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="258" x="655" y="300.4533">Evidencija, status i ponude: dodijeljeni serviser.</text><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="247" x="655" y="314.2521">Odluka o ponudi: vlasnik pripadaju&#263;eg vozila.</text><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="304" x="655" y="328.051">GET liste ograni&#269;ene ulogom, vlasnikom i autoservisom.</text><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="267" x="655" y="341.8498">Filtri: status, mechanicId, from, to, sort, page, size.</text><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="331" x="655" y="355.6486">Completion: finalCost, finalNotes; atomska promjena u Done.</text></g><g id="elem_GMN15"><path d="M1061,236.0886 L1061,287.4851 A0,0 0 0 0 1061,287.4851 L1413,287.4851 A0,0 0 0 0 1413,287.4851 L1413,246.0886 L1403,236.0886 L1241,236.0886 L1237,201.6886 L1233,236.0886 L1061,236.0886 A0,0 0 0 0 1061,236.0886 " fill="#F8F9FA" style="stroke:#212529;stroke-width:0.5;"/><path d="M1403,236.