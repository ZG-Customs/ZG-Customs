nt-family="Arial" font-size="12" lengthAdjust="spacing" textLength="87" x="1510.6" y="136.2533">Stripe obavijesti</text><line style="stroke:#0D6EFD;stroke-width:0.5;" x1="1461.5" x2="1618.5" y1="143.7963" y2="143.7963"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="147" x="1466.5" y="159.0521">POST /api/webhooks/stripe</text><line style="stroke:#0D6EFD;stroke-width:0.5;" x1="1461.5" x2="1618.5" y1="165.5951" y2="165.5951"/></g><g id="elem_GMN9"><path d="M6,243.2986 L6,308.4939 A0,0 0 0 0 6,308.4939 L361,308.4939 A0,0 0 0 0 361,308.4939 L361,253.2986 L351,243.2986 L187.5,243.2986 L183.5,208.3286 L179.5,243.2986 L6,243.2986 A0,0 0 0 0 6,243.2986 " fill="#F8F9FA" style="stroke:#212529;stroke-width:0.5;"/><path d="M351,243.2986 L351,253.2986 L361,253.2986 L351,243.2986 " fill="#F8F9FA" style="stroke:#212529;stroke-width:0.5;"/><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="286" x="12" y="259.5545">Prijava autoservisa: voditelj, naziv i dokaz vlasni&#353;tva.</text><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="334" x="12" y="273.3533">Zahtjev &#269;lanstva: serviser; odluka Accepted/Rejected: voditelj.</text><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="253" x="12" y="287.1521">Uklanjanje &#269;lanstva &#269;uva povijest i vra&#263;a popis</text><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="186" x="12" y="300.951">budu&#263;ih dodjela za preraspodjelu.</text></g><g id="elem_GMN12"><path d="M421,263.4986 L421,356.2916 A0,0 0 0 0 421,356.2916 L827,356.2916 A0,0 0 0 0 827,356.2916 L827,273.4986 L817,263.4986 L628,263.4986 L624,228.9086 L620,263.4986 L421,263.4986 A0,0 0 0 0 421,263.4986 " fill="#F8F9FA" style="stroke:#212529;stroke-width:0.5;"/><path d="M817,263.4986 L817,273.4986 L827,273.4986 L817,263.4986 " fill="#F8F9FA" style="stroke:#212529;stroke-width:0.5;"/><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="311" x="427" y="279.7545">Samo voditelj vlastitog autoservisa za upravlja&#269;ke radnje.</text><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="385" x="427" y="293.5533">Kalendar: from, to, mechanicId; overview sadr&#382;i i nedodijeljene servise.</text><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="288" x="427" y="307.3521">Statistika: zavr&#353;eni servisi po vrsti, prosje&#269;no trajanje,</text><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="100" x="427" y="321.151">ukupna vrijednost.</text><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="247" x="427" y="334.9498">Stripe session vra&#263;a URL checkouta / portala.</text><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="347" x="427" y="348.7486">Pretplata se ne aktivira povratkom preglednika na success URL.</text></g><g id="elem_GMN15"><path d="M887,270.2986 L887,335.4939 A0,0 0 0 0 887,335.4939 L1311,335.4939 A0,0 0 0 0 1311,335.4939 L1311,280.2986 L1301,270.2986 L1103,270.2986 L1099,236.0186 L1095,270.2986 L887,270.2986 A0,0 0 0 0 887,270.2986 " fill="#F8F9FA" style="stroke:#212529;stroke-width:0.5;"/><path d="M1301,270.2986 L1301,280.2986 L1311,280.2986 L1301,270.2986 " fill="#F8F9FA" style="stroke:#212529;stroke-width:0.5;"/><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="323" x="893" y="286.5545">Samo administrator; nema javne registracije administratora.</text><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="276" x="893" y="300.3533">Korisnici: filtri role/status; status Active/Deactivated.</text><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="316" x="893" y="314.1521">Autoservisi: Active/Deactivated; odbijanje je stanje prijave.</text><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="403" x="893" y="327.951">Cijena pretplate je verzionirana; primjena na postoje&#263;e pretplate otvorena.</text></g><g id="elem_GMN18"><path d="M1371,208.3986 L1371,287.3928 A0,0 0 0 0 1371,287.3928 L1709,287.3928 A0,0 0 0 0 1709,287.3928 L1709,218.3986 L1699,208.3986 L1544,208.3986 L1540,174.0686 L1536,208.3986 L1371,208.3986 A0,0 0 0 0 1371,208.3986 " fill="#F8F9FA" style="stroke:#212529;stroke-width:0.5;"/><path d="M1699,208.3986 L1699,218.3986 L1709,218.3986 L1699,208.3986 " fill="#F8F9FA" style="stroke:#212529;stroke-width:0.5;"/><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="210" x="1377" y="224.6545">Vanjski callback, bez korisni&#269;ke sesije.</text><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="288" x="1377" y="238.4533">Provjera Stripe potpisa nad izvornim tijelom zahtjeva.</text><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="267" x="1377" y="252.2521">Jedinstveni event ID sprje&#269;ava dvostruku obradu.</text><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="317" x="1377" y="266.051">2xx tek nakon trajne pohrane; 5xx omogu&#263;uje ponavljanje.</text><text fill="#212529" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="224" x="1377" y="279.8498">Iznose i status potvr&#273;uje Stripe, ne klijent.</text></g><!--link Team to Workshop--><!--link Workshop to Admin--><!--link Admin to Stripe--><rect fill="#DDDDDD" height="74.3945" id="_legend" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1.0;" width="590" x="556" y="374.2916"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="477" x="561" y="392.4234">Sve rute ovdje su prijedlog prema workflowu, nisu implementirani endpointi.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="560" x="561" y="408.5221">GET 200; kreiranje 201; izmjene 200/204; uklanjanje &#269;lanstva 200 s budu&#263;im dodjelama.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="580" x="561" y="424.6207">400 nevaljan unos/potpis; 401 bez prijave; 403 ovlasti; 404 resurs; 409 stanje; 5xx pohrana.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="478" x="561" y="440.7193">Statistika platforme: korisnici, autoservisi, zavr&#353;eni servisi, aktivne pretplate.</text><!--SRC=[jLVBRXit5DthAuXqaOqKsMhwI9G6K6qhSHCqXXyjaA8BQdWjKJD3JlaO1mgopigBVa9-92lvlteud9773oaD41c6BV5UNbwUU-w3JhgCsDiNRCzRftFBUcnqTCWMdFd2y3ARSpKdnhtJbamfhSwPP4N6tRaskSux7PjALN33SsPdNEWBgQRid6UMMX91vzndRgoL-vtdn4P6ykn- -ObS4DiTj8GZO_J5diwqOTyDTWS_39vqCZftp6bcv7Jcc9264YUrQcrACcxjo3aZ9zxHOQ9LPNYdSrk7lUym_FpAatHgj5UYFkdWf_7kU1nbsWWozVhE_ey7u_tEXxOXfHsjipF-UVnaFBfhfxv9M0_NlhaAwm_PBz_q1mQFZ9ppiXrCZbYsmxoypBYohaHSl_dvdGZtWyOBoPpC7p1ksIa1msVFZWzEJfy_ht4yUdDoolgyaFqBRL8xqqMF5qKc4nu2RTVesFvxAJxqSyedPEnC5Zr3_tYoBcvuSV1r-jS7tACHjmfAf0tKssm_cN4basXr_-3rmUd15np1mlMNG_5XMvJGDjFbhHGFh2WCkP3bV7j4E5jJNofE_5a3SviNQo2EuHgTxhrSBpsxFpYw88MQrPjfRpRJH9V1GxhOg9JmZ9JWPgEITQ2nTGqZrghvYKsCB5n3iBMCRslsanabgVQkPydQhzjQQEDujjgu7TADH2uLhc-uqyQcn7G9HZZ951Vjrh8rvbqxaA0MLNohbjQIZGVfclX7sV-fKXiqDnMJczliRQhV4byJpDlxx7YasHeRbUXB-zjqkV-2ROrUOMH2znkwpe7jqEmiumi5SaruAUSK-5KOV_MPEqBH0TS2qsXx93l1x56qZwzuLg-kxtOqcMcTMi0J5BS4pJ6to7GIrQXNQ67yydA-ZLB_a9saHfQ4E9I4-Gj7qV9VF_VCr2vq6M8HIe2qIeSWoKmocm4omLwUdXx1lOKi-QDEDINq_ff98KZztNk-QX6TLQzeIwk4xiIqRg_706m5rJTr6Gj4Gz0pz57bQ5fLcMqGhHex9zfXR6Vwl1gZ8fkg2OktE_fJLceX0_ExO3u0XPD2ftp1WizANdro0UEm-osVkJcLgraGUwCHCaF4B_CfPwCaeSAHw1_J7ACtYMlxqSXPYiqtPqgEJnv_2ntp0HwKXYy_XfL2nX8nyS8lFyePV1Dp0e1uXc0IgRWI5loZ3ffhDM_VkVwA3i7G2S_roYKMu-BqzCQGqthYB2_HXGmNy3Vw_whkua_PkT5v5s-DBckck4C17EfMm2mNvkfpYBaYE8sRPVF0zXgoQEsaBdKfi5pmqbnzmiXHgu0